<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Weather Dashboard | Jun Hwang</title>
    <meta name="description" content="Search any city for current weather and a 5-day forecast." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="assets/css/style.css" />
  </head>
  <body>
    <div class="app">
      <aside class="sidebar">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true">☀</span>
          <span>Weather<strong>Dash</strong></span>
        </div>

        <form id="search-form" class="search" autocomplete="off">
          <label for="city-input" class="sr-only">City</label>
          <input id="city-input" type="search" placeholder="Search a city…" required />
          <button type="submit" aria-label="Search">
            <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M10 2a8 8 0 0 1 6.32 12.9l5.39 5.4-1.41 1.4-5.4-5.39A8 8 0 1 1 10 2Zm0 2a6 6 0 1 0 0 12 6 6 0 0 0 0-12Z"/></svg>
          </button>
        </form>
        <p id="form-error" class="form-error" role="alert"></p>

        <div class="history">
          <div class="history-head">
            <h2>Recent searches</h2>
            <button id="clear-history" class="link-btn" type="button">Clear</button>
          </div>
          <ul id="history-list"></ul>
        </div>

        <p class="credit">Data: <a href="https://open-meteo.com/" target="_blank" rel="noopener">Open-Meteo</a></p>
      </aside>

      <main class="content">
        <section id="empty-state" class="empty">
          <span class="empty-icon" aria-hidden="true">🌤</span>
          <h1>Check the weather anywhere</h1>
          <p>Search for a city to see current conditions and a 5-day forecast.</p>
        </section>

        <section id="loading" class="loading" hidden>
          <span class="spinner" aria-hidden="true"></span> Loading forecast…
        </section>

        <section id="weather" hidden>
          <article class="current card">
            <div class="current-main">
              <div>
                <h1 id="city-name"></h1>
                <p id="current-date" class="muted"></p>
              </div>
              <div class="current-temp">
                <span id="current-icon" class="big-icon" aria-hidden="true"></span>
                <span id="current-temp"></span>
              </div>
              <p id="current-desc" class="desc"></p>
            </div>

            <dl class="stats">
              <div><dt>Feels like</dt><dd id="feels-like"></dd></div>
              <div><dt>Humidity</dt><dd id="humidity"></dd></div>
              <div><dt>Wind</dt><dd id="wind"></dd></div>
              <div><dt>UV index</dt><dd><span id="uv" class="uv"></span></dd></div>
            </dl>
          </article>

          <h2 class="section-title">5-day forecast</h2>
          <div id="forecast" class="forecast"></div>
        </section>
      </main>
    </div>

    <script src="assets/js/script.js"></script>
  </body>
</html>
